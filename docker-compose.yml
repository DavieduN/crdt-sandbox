services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crdt-sandbox-backend
    environment:
      - PORT=1234
      - HOST=0.0.0.0
    ports:
      - "1234:1234"
    restart: unless-stopped

  alice:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crdt-sandbox-alice
    environment:
      - PORT=3000
      - VITE_INSTANCE_NAME=Alice
      - VITE_WS_URL=ws://localhost:1234
      - VITE_ROOM_NAME=crdt-sandbox-room
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  bob:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crdt-sandbox-bob
    environment:
      - PORT=3001
      - VITE_INSTANCE_NAME=Bob
      - VITE_WS_URL=ws://localhost:1234
      - VITE_ROOM_NAME=crdt-sandbox-room
    ports:
      - "3001:3001"
    depends_on:
      - backend
    restart: unless-stopped
